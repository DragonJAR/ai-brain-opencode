name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Windows nativo nunca corrió sobre una máquina real: su resultado es
    # informativo hasta que pase de forma estable (ver CHANGELOG.md).
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Regression suite
        run: bash tests/run.sh
      - name: Scheduler dry-run on the real platform
        run: |
          mkdir -p "$RUNNER_TEMP/vault/scripts/jobs"
          bash scripts/schedule.sh "$RUNNER_TEMP/vault" --dry-run

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -S warning install.sh uninstall.sh scripts/*.sh scripts/lib/*.sh templates/jobs/*.sh
      - name: Python syntax (3.9, the documented minimum)
        run: python3 -m py_compile scripts/lib/*.py scripts/audit.py
